# Render blueprint for the Django API.
# The frontends are static bundles: deploy client/ and admin/ to Vercel/Netlify,
# or add two static services here with `npm run build` and publishPath `dist`.
services:
  - type: web
    name: mehmon-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -"
    healthCheckPath: /api/categories/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Set this in the Render dashboard to your PostgreSQL (e.g. Neon) connection string.
      # Without it the service refuses to boot rather than silently falling back to
      # SQLite on an ephemeral disk.
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Uploaded images need a persistent disk; otherwise use each dish's image_url.
      - key: MEDIA_ROOT
        value: /var/data/media
    disk:
      name: mehmon-media
      mountPath: /var/data
      sizeGB: 1
